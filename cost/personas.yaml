# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Số persona / người dùng đo bằng: python evidence/count_usage_btc.py <data/preclass của repo đề>

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng trợ giảng dưới video / tháng — 3 kịch bản
  low: 144
  base: 361
  high: 721
  source: "data/preclass (BTC): thấp = 144 học viên đã thật sự hỏi trợ giảng dưới video trong 05–25/11/2026 (chat.csv); cao = 721 tài khoản học viên (learners.csv), coi như ai cũng dùng; cơ sở = 50% số tài khoản (tự ước tính, giữa hai mức đo được)"

personas:           # chia 144 người đã hỏi theo số phiên hỏi / tháng; share cộng lại = 1
  - name: hoi_it
    share: 0.58             # 84/144 người, < 4 phiên / tháng
    uses_per_month: 1.5     # trung vị nhóm
    turns_per_session: 2    # trung bình 2.05 câu / phiên
    source: "data/preclass chat.csv: 84/144 người hỏi < 4 phiên/tháng, trung vị 1.5 phiên, 2.05 câu/phiên (evidence/count_usage_btc.py)"
  - name: hoi_vua
    share: 0.33             # 47/144 người, 4–11 phiên / tháng
    uses_per_month: 6.1
    turns_per_session: 2    # trung bình 2.07 câu / phiên
    source: "data/preclass chat.csv: 47/144 người hỏi 4–11 phiên/tháng, trung vị 6.1 phiên, 2.07 câu/phiên (evidence/count_usage_btc.py)"
  - name: hoi_nhieu
    share: 0.09             # 13/144 người, ≥ 12 phiên / tháng
    uses_per_month: 16.8
    turns_per_session: 2    # trung bình 2.33 câu / phiên
    source: "data/preclass chat.csv: 13/144 người hỏi ≥12 phiên/tháng, trung vị 16.8 phiên, 2.33 câu/phiên (evidence/count_usage_btc.py)"
# "Phiên" = các câu một học viên hỏi trợ giảng dưới cùng một video trong cùng một ngày.
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "further-reading/model-prices.md (repo đề) — https://developers.openai.com/api/docs/pricing · BTC xem 25/11/2026 · tầng Nhỏ, model đang dùng để đo token"
  - model: Claude Sonnet 5.5
    input: 2.00
    output: 10.00
    source: "further-reading/model-prices.md (repo đề) — trang giá Anthropic · BTC xem 25/11/2026 · tầng Lớn"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
