<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học và ôn tập</title>
<style>
  :root {
    --bg: #F5F3EE; --panel: #FBFAF6; --line: #D9D4C7; --ink: #14213D; --muted: #4A5568;
    --accent: #0F8C7E; --accent-ink: #FBFAF6; --ok: #0F7A4A; --bad: #B4342D; --chip: #E9E5DA;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0E1526; --panel: #172238; --line: #2A3A57; --ink: #E8EDF5; --muted: #A9B7CC;
            --accent: #4FD1BF; --accent-ink: #0E1526; --ok: #4ADE80; --bad: #F87171; --chip: #22304A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; }
  header span { color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; padding: 20px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  label { display: block; font-size: 14px; color: var(--muted); margin: 8px 0 4px; }
  input[type=text], input[type=number], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  input[type=file] { width: 100%; color: var(--muted); }
  .btn { border: 0; background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1; min-width: 120px; }
  .player { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; border: 0; display: block; }
  .seglist { max-height: 300px; overflow: auto; margin-top: 12px; border-top: 1px solid var(--line); }
  .seg { display: flex; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .seg:hover { background: var(--chip); }
  .seg b { color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 14px; }
  .err { color: var(--bad); font-size: 14px; }
  .q { border-top: 1px solid var(--line); padding: 14px 0; }
  .q:first-child { border-top: 0; }
  .meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; font: inherit; }
  .opt.right { border-color: var(--ok); }
  .opt.wrong { border-color: var(--bad); }
  .ans { margin-top: 8px; padding: 10px 12px; background: var(--chip); border-radius: 8px; font-size: 14px; }
  .ans .v { font-weight: 600; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
  .src { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .src a { color: var(--accent); }
  .empty { text-align: center; padding: 32px 8px; color: var(--muted); }
</style>
</head>
<body>
<header><h1>Học và ôn tập theo video</h1><span>Tải video kèm phụ đề, hoặc dán link YouTube. Tài liệu ôn tập chỉ lấy từ nội dung video, mỗi đáp án dẫn về đúng đoạn.</span></header>
<main>
  <section>
    <div class="card">
      <h2>1 · Mở video để học</h2>
      <div class="tabs"><button class="tab on" data-t="up">Tải video lên</button><button class="tab" data-t="yt">Link YouTube</button></div>
      <div id="t-up">
        <label>File video (phát ngay trên máy, không gửi lên server)</label><input type="file" id="vfile" accept="video/*">
        <label>File phụ đề .srt / .vtt (bắt buộc: nội dung ôn tập lấy từ đây; tải từ nút CC của trang học)</label><input type="file" id="sfile" accept=".srt,.vtt,.txt">
        <label>Tên bài (tuỳ chọn)</label><input type="text" id="title" placeholder="vd Day08 · From workflows to agents">
      </div>
      <div id="t-yt" hidden>
        <label>Link YouTube</label><input type="text" id="yt" placeholder="https://www.youtube.com/watch?v=…">
      </div>
      <div style="margin-top:12px" class="row"><div><button class="btn" id="open">Mở để học</button></div></div>
      <p class="err" id="loadErr"></p>
    </div>
    <div class="card" id="playerCard" hidden>
      <h2 id="vtitle"></h2>
      <div id="playerBox"></div>
      <p class="muted" id="vdesc"></p>
      <div class="seglist" id="segs"></div>
    </div>
  </section>
  <section>
    <div class="card">
      <h2>2 · Tạo tài liệu ôn tập</h2>
      <div class="row">
        <div><label>Loại</label><select id="kieu"><option value="nhanh">Đề nhanh (trắc nghiệm)</option><option value="day_du">Bộ đầy đủ (trắc nghiệm, điền khuyết, tự luận)</option></select></div>
        <div><label>Số câu</label><input type="number" id="socau" value="5" min="3" max="60"></div>
        <div><label>Mức độ</label><select id="mucdo"><option value="de">Dễ</option><option value="vua" selected>Vừa</option><option value="kho">Khó</option></select></div>
      </div>
      <div class="row" style="margin-top:12px"><div><button class="btn" id="make" disabled>Tạo tài liệu ôn tập</button></div><div><button class="btn ghost" id="dl" hidden>Tải về (.md)</button></div></div>
      <p class="muted" id="status">Mở một video trước.</p>
    </div>
    <div class="card"><div id="out"><div class="empty">Tài liệu ôn tập sẽ hiện ở đây.</div></div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (s) => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
let mode = "up", vid = null, ytId = null, last = null;

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  mode = b.dataset.t; $("t-up").hidden = mode !== "up"; $("t-yt").hidden = mode !== "yt";
});

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function seek(sec) {
  if (ytId) { $("playerBox").innerHTML = `<iframe class="player" src="https://www.youtube.com/embed/${ytId}?start=${sec}&autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; }
  else { const v = document.querySelector("#playerBox video"); if (v) { v.currentTime = sec; v.play(); } }
  $("playerCard").scrollIntoView({behavior: "smooth", block: "start"});
}

$("open").onclick = async () => {
  $("loadErr").textContent = ""; $("open").disabled = true;
  try {
    let res;
    if (mode === "yt") {
      const link = $("yt").value.trim(); const m = link.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
      if (!m) throw new Error("Link YouTube chưa đúng.");
      $("open").textContent = "Đang lấy phụ đề…";
      res = await post("/api/load", {youtube: link}); ytId = m[1];
      $("playerBox").innerHTML = `<iframe class="player" src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>`;
    } else {
      const s = $("sfile").files[0]; if (!s) throw new Error("Cần chọn file phụ đề .srt / .vtt cho video.");
      res = await post("/api/load", {subtitle: await s.text(), filename: s.name, title: $("title").value.trim()}); ytId = null;
      const v = $("vfile").files[0];
      $("playerBox").innerHTML = v ? `<video class="player" controls src="${URL.createObjectURL(v)}"></video>` : `<p class="muted">Chưa chọn file video: vẫn tạo được tài liệu ôn tập từ phụ đề.</p>`;
    }
    vid = res.id; $("vtitle").textContent = res.title; $("vdesc").textContent = `${res.segments.length} đoạn · ${res.desc}`;
    $("segs").innerHTML = res.segments.map((g) => `<div class="seg" data-s="${g.start}"><b>${fmt(g.start)}</b><span>${esc(g.text.slice(0, 160))}${g.text.length > 160 ? "…" : ""}</span></div>`).join("");
    $("segs").querySelectorAll(".seg").forEach((d) => d.onclick = () => seek(+d.dataset.s));
    $("playerCard").hidden = false; $("make").disabled = false; $("status").textContent = "Sẵn sàng: bấm “Tạo tài liệu ôn tập”.";
  } catch (e) { $("loadErr").textContent = e.message; }
  $("open").disabled = false; $("open").textContent = "Mở để học";
};

$("kieu").onchange = () => { $("socau").value = $("kieu").value === "day_du" ? 20 : 5; };

function srcHtml(q) {
  const inVideo = (q.nguon_bai || []).map((c) => {
    const m = String(c.link).match(/[?#&]t=(\d+)/); const t = m ? +m[1] : 0;
    return `<button class="btn ghost" data-seek="${t}">▶ Xem trong video · ${esc(c.khoang)}</button>`;
  }).join("");
  const refs = (q.tham_khao || []).map((r) => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.tieu_de)}</a> <span class="muted">(${esc(r.nguon)})</span>`).join("<br>");
  return `<div class="src">${inVideo}</div>${refs ? `<div class="muted" style="margin-top:6px">Tham khảo thêm:<br>${refs}</div>` : ""}`;
}

function answerBox(q, verdict) {
  const quote = q.trich_nguyen_van ? `<div class="muted">Video nói: “${esc(q.trich_nguyen_van)}”</div>` : "";
  const keys = q.y_chinh ? `<div>Ý chính cần có: ${q.y_chinh.map(esc).join(" · ")}</div>` : "";
  return `<div class="ans">${verdict || ""}<div>Đáp án: <span class="v">${esc(q.dap_an)}</span></div>${keys}<div>${esc(q.giai_thich)}</div>${quote}${srcHtml(q)}</div>`;
}

function render(data) {
  const label = {trac_nghiem: "Trắc nghiệm", dien_khuyet: "Điền khuyết", tu_luan: "Tự luận"};
  if (!data.items.length) { $("out").innerHTML = `<div class="empty">Không có câu nào qua kiểm. Thử lại hoặc giảm số câu.</div>`; return; }
  $("out").innerHTML = data.items.map((q, i) => {
    let body = "";
    if (q.loai === "trac_nghiem") body = "ABCD".split("").map((k) => `<button class="opt" data-k="${k}">${k}. ${esc(q.lua_chon[k])}</button>`).join("");
    else if (q.loai === "dien_khuyet") body = `<div class="row"><div><input type="text" placeholder="Điền vào chỗ trống"></div><div style="flex:0"><button class="btn ghost" data-check>Kiểm tra</button></div></div>`;
    else body = `<textarea rows="3" placeholder="Viết câu trả lời của bạn"></textarea><button class="btn ghost" data-show style="margin-top:6px">Xem đáp án mẫu</button>`;
    return `<div class="q" data-i="${i}"><div class="meta">Câu ${i + 1} · ${label[q.loai]} · mức ${esc(q.muc_do)}</div><p><b>${esc(q.cau_hoi)}</b></p>${body}<div class="slot"></div></div>`;
  }).join("");
  const plain = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").trim().replace(/\s+/g, " ");
  $("out").querySelectorAll(".q").forEach((el) => {
    const q = data.items[+el.dataset.i], slot = el.querySelector(".slot");
    const show = (v) => { slot.innerHTML = answerBox(q, v); slot.querySelectorAll("[data-seek]").forEach((b) => b.onclick = () => seek(+b.dataset.seek)); };
    el.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      el.querySelectorAll(".opt").forEach((x) => x.classList.toggle("right", x.dataset.k === q.dap_an));
      const ok = b.dataset.k === q.dap_an; if (!ok) b.classList.add("wrong");
      show(ok ? `<div class="ok">Đúng</div>` : `<div class="bad">Chưa đúng</div>`);
    });
    const chk = el.querySelector("[data-check]");
    if (chk) chk.onclick = () => { const ok = plain(el.querySelector("input").value) === plain(q.dap_an); show(ok ? `<div class="ok">Đúng</div>` : `<div class="bad">Chưa đúng</div>`); };
    const sh = el.querySelector("[data-show]"); if (sh) sh.onclick = () => show("");
  });
}

$("make").onclick = async () => {
  $("make").disabled = true; const full = $("kieu").value === "day_du";
  $("status").textContent = full ? "Đang soạn bộ đầy đủ theo từng đoạn video… (có thể 1–3 phút)" : "Đang soạn đề…";
  try {
    const data = await post("/api/review", {id: vid, kieu: $("kieu").value, so_cau: +$("socau").value, muc_do: $("mucdo").value});
    last = data; render(data); $("dl").hidden = false;
    $("status").textContent = `${data.items.length} câu · bỏ ${data.dropped} câu không qua kiểm · gọi model ${data.chi_phi.goi_model} lần, ${data.chi_phi.token_vao + data.chi_phi.token_ra} token. Chọn đáp án để xem giải thích và đoạn video.`;
  } catch (e) { $("status").textContent = "Lỗi: " + e.message; }
  $("make").disabled = false;
};

$("dl").onclick = () => {
  if (!last) return;
  const L = ["# Tài liệu ôn tập — " + $("vtitle").textContent, ""];
  last.items.forEach((q, i) => {
    L.push(`**Câu ${i + 1}.** ${q.cau_hoi}`);
    if (q.lua_chon) "ABCD".split("").forEach((k) => L.push(`- ${k}. ${q.lua_chon[k]}`));
    L.push("");
  });
  L.push("---", "", "## Đáp án và giải thích", "");
  last.items.forEach((q, i) => {
    L.push(`**Câu ${i + 1}: ${q.dap_an}** — ${q.giai_thich}`);
    if (q.y_chinh) L.push("- Ý chính: " + q.y_chinh.join(" · "));
    if (q.trich_nguyen_van) L.push(`- Video nói: “${q.trich_nguyen_van}”`);
    (q.nguon_bai || []).forEach((c) => L.push(`- Trong video: [${c.ma_doan}] ${c.khoang}${ytId ? " → " + c.link : ""}`));
    (q.tham_khao || []).forEach((r) => L.push(`- Tham khảo: ${r.tieu_de} — ${r.url}`));
    L.push("");
  });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([L.join("\n")], {type: "text/markdown"}));
  a.download = "tai-lieu-on-tap.md"; a.click();
};
</script>
</body>
</html>
